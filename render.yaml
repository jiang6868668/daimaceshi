services:
  - type: web
    name: recipe-video-web
    env: docker
    repo: jiang6868668/daimaceshi
    branch: feature/recipe-video-mvp
    dockerfilePath: Dockerfile
    plan: free
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"

  - type: worker
    name: recipe-video-worker
    env: docker
    repo: jiang6868668/daimaceshi
    branch: feature/recipe-video-mvp
    dockerfilePath: Dockerfile
    plan: free
    startCommand: "python -m backend.app.worker"
